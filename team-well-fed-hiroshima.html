<meta name="theme-color" content="#12161d"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="吃飽飽旅行團"/>
<style>
  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --ink:#1a2433;
    --ink-soft:#5b6472;
    --line:#e2e6ed;
    --accent:#1a3a5c;
    --accent-soft:#eef4fb;
    --accent-tint:#d6e8f5;
    --warn:#c1442d;
    --warn-bg:#fdeeea;
    --pill:#2568a8;
    --star:#b8862e;
    --tip-bg:#fff8e6;
    --tip-ink:#8a6412;
    --good:#2e8b57;
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161d;
      --card:#1b212b;
      --ink:#e8ecf2;
      --ink-soft:#9aa5b3;
      --line:#2a3240;
      --accent:#1e354d;
      --accent-soft:#1c2a3a;
      --accent-tint:#20374a;
      --warn:#ff8a70;
      --warn-bg:#3a2420;
      --pill:#5fa0d8;
      --star:#e0b25a;
      --tip-bg:#2e2712;
      --tip-ink:#e0c070;
      --good:#5fc98a;
    }
    header.top{background:#162434;color:#fff;}
    .daypill{background:rgba(255,255,255,.15);color:#fff;opacity:.85;}
    .daypill.active{background:#fff;color:#8fbde6;opacity:1;}
    .daypill .dd{color:inherit;opacity:.9;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* 全站字體 3 級距：所有用 rem 的文字都相對這個根字體大小縮放，三級比例天生一致 */
  html{font-size:16px;}
  html.font-lg{font-size:18px;}
  html.font-xl{font-size:20px;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    -webkit-text-size-adjust:100%;overflow:hidden;}
  body{display:flex;flex-direction:column;height:100dvh;}

  header.top{flex:0 0 auto;z-index:30;background:var(--accent);color:#fff;padding:10px 14px 6px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  header.top h1{margin:0;font-size:0.938rem;font-weight:700;letter-spacing:.02em;}
  header.top .sub{font-size:0.688rem;opacity:.75;margin-top:2px;margin-bottom:8px;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .daypill{flex:0 0 auto;width:46px;padding:5px 0 6px;border-radius:12px;background:rgba(255,255,255,.12);
    border:none;color:#fff;opacity:.7;text-align:center;cursor:pointer;}
  .daypill .dn{font-size:0.938rem;font-weight:800;line-height:1.1;}
  .daypill .dd{font-size:0.594rem;opacity:.85;margin-top:1px;}
  .daypill.active{background:#fff;color:var(--accent);opacity:1;}
  .featpill{flex:0 0 auto;padding:0 11px;border-radius:12px;background:rgba(255,255,255,.12);
    border:none;color:#fff;opacity:.7;font-size:0.688rem;font-weight:700;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;cursor:pointer;}
  .featpill span.fi{font-size:14px;}
  .featpill.active{background:#fff;color:var(--accent);opacity:1;}
  .tab-sep{flex:0 0 auto;width:1px;background:rgba(255,255,255,.25);margin:6px 2px;}

  .day-head{margin:4px 2px 14px;}
  .day-head .date{font-size:0.813rem;color:var(--ink-soft);font-weight:600;}
  .day-head .route{font-size:1.188rem;font-weight:800;margin-top:2px;line-height:1.3;}
  .day-head .theme{margin-top:8px;background:var(--accent-soft);color:var(--accent);
    padding:9px 12px;border-radius:12px;font-size:0.813rem;font-weight:600;line-height:1.5;}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .info-grid .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;}
  .info-grid .label{font-size:0.781rem;color:var(--accent);font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
  .info-grid .value{font-size:0.938rem;font-weight:800;line-height:1.4;color:var(--ink);}
  .info-grid .value small{display:block;font-weight:500;color:var(--ink);font-size:0.844rem;line-height:1.5;margin-top:6px;background:var(--bg);padding:6px 8px;border-radius:8px;border:1px solid var(--line);}

  /* --- Timeline V2 Card Block Design --- */
  
  /* --- 🌟 Scheme A: Header Integrated + 100% Full Width Card Layout --- */
  .card-item{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.03);}
  .card-head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;}
    /* --- 🌟 2-Line Golden Header Layout --- */
  .card-item{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:14px 16px;display:flex;flex-direction:column;gap:9px;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.03);}
  
  .card-head-line1{display:flex;align-items:center;gap:10px;width:100%;}
  .icon-badge{width:38px;height:38px;border-radius:50%;background:var(--accent-tint);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);}
  .card-time-pill{background:var(--accent-tint);color:var(--accent);font-size:0.813rem;font-weight:800;
    padding:5px 11px;border-radius:10px;white-space:nowrap;flex:0 0 auto;letter-spacing:-0.01em;}
  .card-actions{display:flex;flex-direction:row;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto;flex-wrap:nowrap;}
  .action-btn{width:28px;height:28px;border-radius:50%;background:var(--accent-tint);color:var(--accent);
    border:none;display:inline-flex;align-items:center;justify-content:center;font-size:0.75rem;text-decoration:none;cursor:pointer;flex:0 0 auto;}
  .action-btn:active{transform:scale(.92);}

  .card-head-line2{display:flex;flex-direction:column;gap:2px;width:100%;padding-top:2px;}
  .card-title{font-size:1.063rem;font-weight:800;color:var(--ink);line-height:1.35;}
  .card-location{font-size:0.781rem;color:var(--pill);display:flex;align-items:center;gap:4px;font-weight:700;margin-top:1px;}

  .card-body{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:2px;}
  .card-note{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:0.875rem;
    line-height:1.65;color:var(--ink);border:none;}
  .note-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:7px;line-height:1.6;font-size:0.844rem;}
  .note-row:last-child{margin-bottom:0;}
  .note-bullet{flex:0 0 auto;font-weight:800;color:var(--pill);line-height:1.6;}
  .note-text{flex:1;min-width:0;color:var(--ink);}

  /* Mobile RWD */
  @media (max-width: 540px){
    .card-item{padding:12px 12px;gap:8px;border-radius:16px;}
    .icon-badge{width:34px;height:34px;font-size:17px;}
    .card-time-pill{font-size:0.75rem;padding:4px 9px;}
    .card-title{font-size:1rem;}
    .card-location{font-size:0.75rem;}
    .card-note{padding:10px 12px;font-size:0.844rem;line-height:1.6;}
  }

  /* Mobile RWD for Scheme A */
  @media (max-width: 540px){
    .card-item{padding:12px 12px;gap:8px;border-radius:16px;}
    .icon-badge{width:36px;height:36px;font-size:18px;}
    .card-title{font-size:0.969rem;}
    .card-location{font-size:0.75rem;}
    .card-note{padding:10px 12px;font-size:0.844rem;line-height:1.6;}
  }


  /* Collapsible table inside card */
  .tbl-toggle-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent-tint);
    color:var(--accent);border:1px solid var(--pill);border-radius:999px;padding:6px 14px;
    font-size:0.813rem;font-weight:800;font-family:inherit;margin-top:10px;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.04);transition:all .15s;}
  .tbl-toggle-btn:active{transform:scale(.96);}
  .tbl-toggle-btn .tbl-arrow{font-size:11px;transition:transform .2s;}
  .tbl-toggle-btn.open{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* Collapsible resto info inside card */
  .resto-toggle-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);
    color:var(--accent);border:1px solid var(--accent-tint);border-radius:999px;padding:6px 14px;
    font-size:0.813rem;font-weight:800;font-family:inherit;margin-top:10px;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.04);transition:all .15s;}
  .resto-toggle-btn:active{transform:scale(.96);}
  .resto-toggle-btn .r-arrow{font-size:11px;transition:transform .2s;}
  .resto-toggle-btn.open{background:var(--accent);color:#fff;border-color:var(--accent);}

  .card-resto-wrap{margin-top:10px;display:none;animation:fade .18s ease;}
  .card-resto-wrap .resto{margin-bottom:0;}

  .card-table-wrap{margin-top:10px;display:none;animation:fade .18s ease;}
  .card-table-wrap table.ref{margin-bottom:0;}

  .card-note b{color:var(--ink);}
  .card-note .warn{color:var(--warn);font-weight:700;}
  .card-note .star{color:var(--star);font-weight:700;}

  .card-actions{display:flex;flex-direction:row;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto;}
  .action-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:0.813rem;
    cursor:pointer;transition:all .15s;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .action-btn:active{transform:scale(.9);}
  .action-btn.nav-btn{background:var(--accent-tint);color:var(--accent);border:1px solid var(--pill);
    padding:4px 10px;border-radius:999px;font-size:0.781rem;font-weight:800;white-space:nowrap;width:auto;height:auto;}

  /* Transit Connector Line */
  .transit-connector{display:flex;align-items:center;justify-content:flex-start;position:relative;
    padding:10px 0 10px 24px;margin-left:14px;}

/* ---------- 📱 OPTION E: iOS 導覽列滑動 (Slide + Fade, 2D) ---------- */
/* #main 是「舞台」：固定高度＝視窗扣掉 header，純 2D 位移不需要 perspective */
#main {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

/* 每個 .day-panel 本身就是可獨立捲動的「一頁」 */
.day-panel {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  max-width: 640px;
  margin: 0 auto;
  padding: 14px 12px 110px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  background: var(--bg);
}
.day-panel::-webkit-scrollbar{display:none;}
.day-panel.active { display: block !important; z-index: 10; }
.day-panel.animating-out { display: block !important; z-index: 1; pointer-events: none; }
.day-panel.animating-in  { display: block !important; z-index: 10; pointer-events: none; }

@keyframes slideExitLeft   { 0% { opacity: 1; transform: translateX(0) scale(1); } 100% { opacity: .2; transform: translateX(-30%) scale(.95); } }
@keyframes slideEnterRight { 0% { opacity: 0; transform: translateX(100%) scale(.98); box-shadow: -20px 0 32px rgba(0,0,0,.3); } 100% { opacity: 1; transform: translateX(0) scale(1); box-shadow: none; } }
@keyframes slideExitRight  { 0% { opacity: 1; transform: translateX(0) scale(1); } 100% { opacity: .2; transform: translateX(30%) scale(.95); } }
@keyframes slideEnterLeft  { 0% { opacity: 0; transform: translateX(-100%) scale(.98); box-shadow: 20px 0 32px rgba(0,0,0,.3); } 100% { opacity: 1; transform: translateX(0) scale(1); box-shadow: none; } }

/* Day1 → Day2（往後翻）：舊頁往左滑出淡化，新頁從右邊滑入 */
.day-panel.exit-fwd  { animation: slideExitLeft .5s cubic-bezier(.25,1,.5,1) forwards; }
.day-panel.enter-fwd { animation: slideEnterRight .5s cubic-bezier(.25,1,.5,1) forwards; }

/* Day2 → Day1（往回翻）：方向相反，translateX 正負號本身就是方向 */
.day-panel.exit-bwd  { animation: slideExitRight .5s cubic-bezier(.25,1,.5,1) forwards; }
.day-panel.enter-bwd { animation: slideEnterLeft .5s cubic-bezier(.25,1,.5,1) forwards; }
</style>

        spot_guide:{

            {text:"🏛️ 1. 原爆圓頂館歷史 —— 1915 年捷克建築師設計完工（廣島縣產業獎勵館）。1945 年 8 月 6 日原子彈在其東南方 160m、高度 600m 正上方爆炸，衝擊波垂直作用，使中心結構奇蹟殘存。", place:"原爆ドーム 広島"},

            {text:"🦉 5. 梟之館 (Owl Tower) —— 大正老宅改建，全館展示約 1,500 件貓頭鷹藝術收藏，滿月夜晚會舉辦完全預約制的觀月酒會。入場含消費：大人 ¥500／中高生 ¥300／小學生 ¥200（2F美術館用餐者另加 ¥200）。平日10:30–日落，六日/假日10:00–日落，公休週三。", place:"梟の館 尾道"},

function renderNote(html){
  if(!html) return "";
  let processed = html
    .replaceAll("⚠️", "<span class='warn'>⚠️</span>")
    .replaceAll("★", "<span class='star'>★</span>");
  var lines = processed.split(/<br\s*\/?>|\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  if(lines.length >= 1){
    return lines.map(function(l){
      var clean = l.replace(/^[•\s\u2022\u25cf\-\t]+/g, "").trim();
      return '<div class="note-row"><span class="note-bullet">•</span><div class="note-text">' + clean + '</div></div>';
    }).join("");
  }
  return processed;
}

function mapsUrl(o,d){
  return "https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(o)+"&destination="+encodeURIComponent(d)+"&travelmode=transit";

function mapsSearchUrl(q){
  return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);

function renderRestoItem(it){
  const text = (typeof it === "string") ? it : it.text;
  const place = (typeof it === "object" && it.place) ? it.place : null;

function escAttr(s){

/* Modal Manager */
function openModal(innerHtml){
  closeModal();
  const ov = document.createElement("div");
  ov.className = "modal-overlay";

  ov.onclick = (e)=>{ if(e.target===ov) closeModal(); };

}

}

/* Schedule State & Item Actions */
let scheduleState = {};
try{ scheduleState = JSON.parse(localStorage.getItem("scheduleState_v2")||"{}"); }catch(e){}
function saveScheduleState(){ try{ localStorage.setItem("scheduleState_v2", JSON.stringify(scheduleState)); }catch(e){} }
function dayState(dayId){
  if(!scheduleState[dayId]) scheduleState[dayId] = {overrides:{}, deleted:[], added:[], customOrder:null};
  return scheduleState[dayId];
}
function getEffectiveSchedule(d){
  const st = dayState(d.id);
  let list = d.schedule.map((s,idx)=>Object.assign({}, s, {_id:"b"+idx}));
  list = list.filter(s=> st.deleted.indexOf(s._id)===-1);
  list = list.map(s=> st.overrides[s._id] ? Object.assign({}, s, st.overrides[s._id]) : s);
  const added = (st.added||[]).map(a=>Object.assign({}, a));
  let combined = list.concat(added);
  if(st.customOrder && Array.isArray(st.customOrder)){
    const map = new Map(combined.map(item => [item._id, item]));
    let ordered = [];
    st.customOrder.forEach(id => {
      if(map.has(id)){ ordered.push(map.get(id)); map.delete(id); }
    });
    map.forEach(item => ordered.push(item));
    combined = ordered;
  }
  return combined;
}

function moveScheduleItem(dayId, itemId, dir){
  const d = DAYS.find(x=>x.id===dayId);
  let list = getEffectiveSchedule(d);
  const idx = list.findIndex(s=>s._id===itemId);
  if(idx === -1) return;
  const targetIdx = idx + dir;
  if(targetIdx < 0 || targetIdx >= list.length) return;
  const temp = list[idx];
  list[idx] = list[targetIdx];
  list[targetIdx] = temp;
  const st = dayState(dayId);
  st.customOrder = list.map(s=>s._id);
  saveScheduleState();
  rerenderDay(dayId);
}

function openScheduleEditor(dayId, itemId){
  const d = DAYS.find(x=>x.id===dayId);
  const list = getEffectiveSchedule(d);
  const isNew = !itemId;
  const item = isNew ? {time:"",icon:"📌",title:"",note:"",transit:""} : (list.find(s=>s._id===itemId) || {time:"",icon:"📌",title:"",note:"",transit:""});
  openModal(`
    <h3>${isNew?"新增行程卡片":"編輯行程卡片"}</h3>
    <div class="modal-row">
      <div class="modal-field"><label>時間</label><input id="mf-time" value="${escAttr(item.time)}" placeholder="例：10:00–11:00"/></div>
      <div class="modal-field" style="max-width:64px;flex:0 0 64px;"><label>圖示</label><input id="mf-icon" value="${escAttr(item.icon)}" placeholder="📌"/></div>
    </div>
    <div class="modal-field"><label>標題</label><input id="mf-title" value="${escAttr(item.title)}"/></div>
    <div class="modal-field"><label>移動連線備註（如 🚌 30m）</label><input id="mf-transit" value="${escAttr(item.transit||"")}"/></div>
    <div class="modal-field"><label>備註內容</label><textarea id="mf-note">${item.note||""}</textarea></div>
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal()">取消</button>
      ${isNew?"":`<button class="mbtn-delete" onclick="deleteScheduleItem(${dayId},'${itemId}')">刪除</button>`}
      <button class="mbtn-save" onclick="saveScheduleItem(${dayId}, ${isNew?"null":`'${itemId}'`})">儲存</button>
    </div>
  `);
}

function saveScheduleItem(dayId, itemId){
  const time = document.getElementById("mf-time").value.trim();
  const icon = document.getElementById("mf-icon").value.trim() || "📌";
  const title = document.getElementById("mf-title").value.trim();
  const transit = document.getElementById("mf-transit").value.trim();
  const note = document.getElementById("mf-note").value.trim();
  if(!title){ alert("請輸入標題"); return; }
  const st = dayState(dayId);
  if(itemId===null){
    st.added.push({_id:"u"+Date.now(), time, icon, title, note, transit});
  } else if(itemId.indexOf("b")===0){
    st.overrides[itemId] = {time, icon, title, note, transit};
  } else {
    const a = st.added.find(x=>x._id===itemId);
    if(a){ a.time=time; a.icon=icon; a.title=title; a.note=note; a.transit=transit; }
  }
  saveScheduleState();
  closeModal();
  rerenderDay(dayId);
}

function deleteScheduleItem(dayId, itemId){
  const st = dayState(dayId);
  if(itemId.indexOf("b")===0){
    st.deleted.push(itemId);
  } else {
    st.added = st.added.filter(x=>x._id!==itemId);
  }
  saveScheduleState();
  closeModal();
  rerenderDay(dayId);
}

function rerenderDay(dayId){
  const d = DAYS.find(x=>x.id===dayId);
  const old = document.getElementById("day-"+dayId);
  if(!old) return;
  const wasActive = old.classList.contains("active");
  const fresh = buildDay(d);
  if(wasActive) fresh.classList.add("active");
  old.replaceWith(fresh);
}

function buildDay(d){
  const panel = document.createElement("section");
  panel.className = "day-panel" + (d.id===1?" active":"");
  panel.id = "day-"+d.id;

  let html = `
    <div class="day-head">
      <div class="date">${d.date}</div>
      <div class="route">${d.route}</div>
      <div class="theme">🎯 ${d.theme}</div>
    </div>`;

  if(d.info && d.info.length){
    html += `<div class="info-grid">`;
    d.info.forEach(i=>{
      html += `<div class="card"><div class="label">${i.label}</div><div class="value">${i.value}${i.small?`<small>${i.small}</small>`:""}</div></div>`;
    });
    html += `</div>`;
  }

  /* --- Timeline V2 rendering --- */
  html += `<div class="timeline-v2">`;
  const schedule = getEffectiveSchedule(d);
  schedule.forEach((s, idx)=>{
    const isFirst = idx === 0;
    const isLast = idx === schedule.length - 1;

    let tableHtml = "";
    if(s.table_ref && d.tables){
      const t = d.tables.find(x=>x.id===s.table_ref);
      if(t){
        const wrapId = "tblwrap-" + d.id + "-" + s.table_ref;
        tableHtml = `
          <div>
            <button class="tbl-toggle-btn" onclick="toggleCardTable(this, '${wrapId}')">⏱️ 查看車次時間表 <span class="tbl-arrow">▼</span></button>
            <div class="card-table-wrap" id="${wrapId}">
              <table class="ref">
                <tr>${t.cols.map(c=>`<th>${c}</th>`).join("")}</tr>
                ${t.rows.map(r=>`<tr class="${r[t.cols.length]===true?'rec':''}">${r.slice(0,t.cols.length).map((c,i)=>`<td class="${i===0?'left':''}">${c}</td>`).join("")}</tr>`).join("")}
              </table>
            </div>
          </div>
        `;
      }
    }

    let restoHtml = "";
    if(d.restos && s.resto_ref && typeof s.resto_ref === 'string'){
      const rItem = d.restos.find(r=> r.name.includes(s.resto_ref) || s.resto_ref.includes(r.name));
      if(rItem){
        const rWrapId = "rwrap-" + d.id + "-" + idx;
        restoHtml = `
          <div>
            <button class="resto-toggle-btn" onclick="toggleCardResto(this, '${rWrapId}')">🏮 餐廳詳情與菜色推薦 <span class="r-arrow">▼</span></button>
            <div class="card-resto-wrap" id="${rWrapId}">
              <div class="resto">
                <h4>${rItem.name}</h4>
                <ul>${rItem.items.map(renderRestoItem).join("")}</ul>
              </div>
            </div>
          </div>
        `;
      }
    }

    let spotGuideHtml = "";
    if(s.spot_guide){
      const gWrapId = "gwrap-" + d.id + "-" + idx;
      spotGuideHtml = `
        <div>
          <button class="resto-toggle-btn" style="border-color:var(--pill);color:var(--pill);margin-top:8px;" onclick="toggleCardSpotGuide(this, '${gWrapId}')">🏛️ 景點故事與實用攻略 <span class="r-arrow">▼</span></button>
          <div class="card-resto-wrap" id="${gWrapId}">
            <div class="resto" style="background:var(--accent-soft);border-color:var(--line);">
              <h4 style="color:var(--accent);">${s.spot_guide.title}</h4>
              <ul>${s.spot_guide.items.map(renderRestoItem).join("")}</ul>
            </div>
          </div>
        </div>
      `;
    }

    let noteBoxHtml = "";
    if(s.note || tableHtml || restoHtml || spotGuideHtml){
      noteBoxHtml = `<div class="card-note">`;
      if(s.note){
        noteBoxHtml += `<div>${renderNote(s.note)}</div>`;
      }
      if(spotGuideHtml) noteBoxHtml += spotGuideHtml;
      if(tableHtml) noteBoxHtml += tableHtml;
      if(restoHtml) noteBoxHtml += restoHtml;
      noteBoxHtml += `</div>`;
    }

    html += `
      <div class="card-item">
        <div class="card-head-line1">
          <div class="icon-badge">${escAttr(s.icon||"📌")}</div>
          <div class="card-time-pill">${escAttr(s.time)}</div>
          ${s.nav?`<div class="card-actions"><a class="action-btn nav-btn" href="${mapsUrl(s.nav.o,s.nav.d)}" target="_blank" title="開啟導航">📍 導航</a></div>`:''}
        </div>
        <div class="card-head-line2">
          <div class="card-title">${escAttr(s.title)}</div>
          ${s.nav?`<div class="card-location">📍 ${s.nav.d}</div>`:''}
        </div>
        ${noteBoxHtml?`<div class="card-body">${noteBoxHtml}</div>`:''}
      </div>
    `;

    // Render transit connector between cards
    if(!isLast){
      const transitText = s.transit || "移動";
      html += `
        <div class="transit-connector">
          <div class="transit-line"></div>
          <div class="transit-badge">${transitText}</div>
        </div>
      `;
    }
  });
  html += `</div>`;

  html += `<button class="fab" onclick="openScheduleEditor(${d.id}, null)" title="新增行程卡片">＋</button>`;

  if(d.tables){
    d.tables.forEach(t=>{
      // Only render external table if not embedded in schedule items
      const isEmbedded = d.schedule.some(s=>s.table_ref===t.id);
      if(!isEmbedded){
        html += `<div class="section-title" id="tbl-${t.id||''}"><span class="bar"></span>${t.title}</div>
          <table class="ref"><tr>${t.cols.map(c=>`<th>${c}</th>`).join("")}</tr>`;
        t.rows.forEach(r=>{

        });
        html += `</table>`;
      }
    });
  }

  if(d.restos){
    d.restos.forEach(r=>{
      // Only render at bottom if not embedded inside any schedule card
      const isEmbedded = d.schedule.some(s => s.resto_ref && (
        r.name.includes(s.resto_ref) || s.resto_ref.includes(r.name) ||

        (s.resto_ref === "燒肉" && r.name.includes("燒肉"))
      ));

        html += `<div class="section-title"><span class="bar"></span>餐廳詳情</div>
          <div class="resto"><h4>${r.name}</h4><ul>`;
        r.items.forEach(it=>{
          html += renderRestoItem(it);
        });
        html += `</ul></div>`;
      }
    });
  }

  panel.innerHTML = html;
  return panel;
}

let customRate = 0.215;
let isRateLocked = false;
try{
  customRate = Number(localStorage.getItem("customRate")||"0.215") || 0.215;
  isRateLocked = localStorage.getItem("isRateLocked") === "true";
}catch(e){}

function toggleLockRate(){
  const lockEl = document.getElementById("calc-lock");
  if(lockEl){
    isRateLocked = lockEl.checked;
    try{ localStorage.setItem("isRateLocked", String(isRateLocked)); }catch(e){}
    updateRateTag();
  }
}

function updateRateTag(){
  const tag = document.getElementById("rate-status-tag");
  const lockEl = document.getElementById("calc-lock");
  if(lockEl) lockEl.checked = isRateLocked;
  if(tag){
    if(isRateLocked){
      tag.textContent = "🔒 鎖定手動";
      tag.style.background = "var(--warn-bg)";
      tag.style.color = "var(--warn)";
    } else {
      tag.style.background = "var(--accent-soft)";
      tag.style.color = "var(--ink-soft)";
    }
  }
}

function fetchLiveRate(){
  const tag = document.getElementById("rate-status-tag");
  if(isRateLocked){
    if(tag) tag.textContent = "🔒 鎖定手動";
    return;
  }
  if(tag) tag.textContent = "更新中…";
  fetch("https://open.er-api.com/v6/latest/JPY")
    .then(res => res.json())
    .then(data => {
      if(data && data.rates && data.rates.TWD){
        const live = Number(data.rates.TWD.toFixed(4));
        customRate = live;
        try{ localStorage.setItem("customRate", String(customRate)); }catch(e){}
        const el = document.getElementById("calc-rate");
        if(el) el.value = customRate;
        if(tag) tag.textContent = "🟢 即時匯率";
        calcJpyToTwd();
        renderBudget();
      }
    })
    .catch(err => {
      if(tag) tag.textContent = "📡 離線模式";
    });
}

function saveCustomRate(){
  const el = document.getElementById("calc-rate");
  if(el){
    const v = Number(el.value);
    customRate = (v > 0) ? v : 0.215;
    try{ localStorage.setItem("customRate", String(customRate)); }catch(e){}
    updateRateTag();
    calcJpyToTwd();
    renderBudget();
  }
}

function calcJpyToTwd(){
  const jpyEl = document.getElementById("calc-jpy");
  const twdEl = document.getElementById("calc-twd");
  if(!jpyEl || !twdEl) return;
  const val = Number(jpyEl.value);
  if(!jpyEl.value){ twdEl.value = ""; return; }
  twdEl.value = Math.round(val * customRate);
}

function calcTwdToJpy(){
  const jpyEl = document.getElementById("calc-jpy");
  const twdEl = document.getElementById("calc-twd");
  if(!jpyEl || !twdEl) return;
  const val = Number(twdEl.value);
  if(!twdEl.value){ jpyEl.value = ""; return; }
  jpyEl.value = Math.round(val / customRate);
}

function setQuickJpy(amt){
  const jpyEl = document.getElementById("calc-jpy");
  if(jpyEl){
    jpyEl.value = amt;
    calcJpyToTwd();
  }
}

function resizeImageFile(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

let currentActiveId = "day-1";

let isPageAnimating = false;

function showPage(id){
  if(currentActiveId === id || isPageAnimating) return;

  const panels = Array.from(document.querySelectorAll(".day-panel"));
  const oldPanel = document.getElementById(currentActiveId);
  const newPanel = document.getElementById(id);
  
  if(!newPanel) return;

  const oldIdx = panels.findIndex(p => p.id === currentActiveId);
  const newIdx = panels.findIndex(p => p.id === id);
  const isForward = (newIdx >= oldIdx) || (oldIdx === -1);

  isPageAnimating = true;

  // 每張「頁面」各自捲動，切換頁面時新頁一律從頂部開始
  newPanel.scrollTop = 0;

  // Prepare dual layer classes
  panels.forEach(p => {
    p.className = "day-panel" + (p.id === id ? " active" : "");
  });

  if(oldPanel && oldPanel !== newPanel){
    oldPanel.classList.add("animating-out", isForward ? "exit-fwd" : "exit-bwd");
    newPanel.classList.add("animating-in", isForward ? "enter-fwd" : "enter-bwd");

    setTimeout(() => {
      oldPanel.className = "day-panel";
      newPanel.className = "day-panel active";
      isPageAnimating = false;
    }, 500);
  } else {
    newPanel.classList.add("active");
    isPageAnimating = false;
  }

  document.querySelectorAll(".daypill, .featpill").forEach(t=>t.classList.toggle("active", t.id==="tab-"+id));
  currentActiveId = id;
}

let shopState = {};
try{ shopState = JSON.parse(localStorage.getItem("shopState")||"{}"); }catch(e){}

let shopEditState = {};
try{ shopEditState = JSON.parse(localStorage.getItem("shopEditState")||"{}"); }catch(e){}
function saveShopEditState(){ try{ localStorage.setItem("shopEditState", JSON.stringify(shopEditState)); }catch(e){} }
function shopCatState(ci){
  if(!shopEditState[ci]) shopEditState[ci] = {overrides:{}, deleted:[], added:[]};
  return shopEditState[ci];
}
function getEffectiveShopItems(ci){
  const cat = SHOP_CATEGORIES[ci];
  const st = shopCatState(ci);
  let list = cat.items.map((it,idx)=>Object.assign({}, it, {_id:"b"+idx}));
  list = list.filter(it=> st.deleted.indexOf(it._id)===-1);
  list = list.map(it=> st.overrides[it._id] ? Object.assign({}, it, st.overrides[it._id]) : it);
  const added = (st.added||[]).map(a=>Object.assign({}, a));
  return list.concat(added);
}

function toggleShop(ci, itemId){
  const key = ci+"-"+itemId;
  shopState[key] = !shopState[key];
  try{ localStorage.setItem("shopState", JSON.stringify(shopState)); }catch(e){}
  renderShopList(ci);
}

function renderShopList(ci){
  const items = getEffectiveShopItems(ci);
  const listEl = document.getElementById("shop-list-"+ci);
  if(!listEl) return;
  let done = 0;
  listEl.innerHTML = items.map(it=>{
    const key = ci+"-"+it._id;
    const on = !!shopState[key];
    if(on) done++;
    return `<div class="cl-item${on?' done':''}" onclick="toggleShop(${ci},'${it._id}')">
      <div class="cl-box">${on?"✓":""}</div>
      <div class="cl-label">${escAttr(it.label)}<small>${escAttr(it.small)}</small></div>
      <a class="item-nav" href="${mapsSearchUrl(it.label)}" target="_blank" onclick="event.stopPropagation()" title="開啟導航">📍</a>
      <span class="ed-edit" onclick="event.stopPropagation();openShopEditor(${ci},'${it._id}')" title="編輯">✎</span>
    </div>`;
  }).join("");
  const frac = document.getElementById("shop-frac-"+ci);
  const fill = document.getElementById("shop-fill-"+ci);
  if(frac) frac.textContent = done+"/"+items.length;
  if(fill) fill.style.width = (items.length ? Math.round(done/items.length*100) : 0)+"%";
}

function openShopEditor(ci, itemId){
  const items = getEffectiveShopItems(ci);
  const isNew = !itemId;
  const item = isNew ? {label:"", small:""} : (items.find(it=>it._id===itemId) || {label:"", small:""});
  openModal(`
    <h3>${isNew?"新增店家":"編輯店家"}</h3>
    <div class="modal-field"><label>店名</label><input id="mf-shop-label" value="${escAttr(item.label)}"/></div>
    <div class="modal-field"><label>說明</label><input id="mf-shop-small" value="${escAttr(item.small)}"/></div>
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal()">取消</button>
      ${isNew?"":`<button class="mbtn-delete" onclick="deleteShopItem(${ci},'${itemId}')">刪除</button>`}
      <button class="mbtn-save" onclick="saveShopItem(${ci}, ${isNew?"null":`'${itemId}'`})">儲存</button>
    </div>
  `);
}

function saveShopItem(ci, itemId){
  const label = document.getElementById("mf-shop-label").value.trim();
  const small = document.getElementById("mf-shop-small").value.trim();
  if(!label){ alert("請輸入店名"); return; }
  const st = shopCatState(ci);
  if(itemId===null){
    st.added.push({_id:"u"+Date.now(), label, small});
  } else if(itemId.indexOf("b")===0){
    st.overrides[itemId] = {label, small};
  } else {
    const a = st.added.find(x=>x._id===itemId);
    if(a){ a.label=label; a.small=small; }
  }
  saveShopEditState();
  closeModal();
  renderShopList(ci);
}

function deleteShopItem(ci, itemId){
  const st = shopCatState(ci);
  if(itemId.indexOf("b")===0){
    st.deleted.push(itemId);
  } else {
    st.added = st.added.filter(x=>x._id!==itemId);
  }
  saveShopEditState();
  closeModal();
  renderShopList(ci);
}

const FONT_TIERS = ["", "font-lg", "font-xl"];
const FONT_TIER_LABELS = ["🅰️ 一般", "🅰️ 大", "🅰️ 超大"];
let fontTier = 0;
try{ fontTier = parseInt(localStorage.getItem("fontTier"), 10) || 0; }catch(e){}
if(fontTier < 0 || fontTier > 2) fontTier = 0;

function updateFontMode(){
  document.documentElement.classList.remove("font-lg", "font-xl");
  if(FONT_TIERS[fontTier]) document.documentElement.classList.add(FONT_TIERS[fontTier]);
  const btn = document.getElementById("font-toggle-btn");
  if(btn){
    const isDefault = fontTier === 0;
    btn.textContent = FONT_TIER_LABELS[fontTier];
    btn.style.background = isDefault ? "rgba(255,255,255,.2)" : "#fff";
    btn.style.color = isDefault ? "#fff" : "var(--accent)";
  }
}

function toggleLargeFont(){
  fontTier = (fontTier + 1) % 3;
  try{ localStorage.setItem("fontTier", String(fontTier)); }catch(e){}
  updateFontMode();
}

updateFontMode();
buildTabs();
const main = document.getElementById("main");
DAYS.forEach(d=> main.appendChild(buildDay(d)));
main.appendChild(buildShopPage());
main.appendChild(buildBudgetPage());
Object.keys(EDITABLE_LISTS).forEach(key=>{
  main.appendChild(buildEditablePage(key));
});
SHOP_CATEGORIES.forEach((cat,ci)=> renderShopList(ci));
renderBudget();
fetchLiveRate();
Object.keys(EDITABLE_LISTS).forEach(key=> renderEditableList(key));

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
